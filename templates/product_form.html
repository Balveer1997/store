{% extends "base.html" %}{% block title %}प्रोडक्ट एडिट | Stationery Hub{% endblock %}{% block content %}<section class="page-head"><div class="eyebrow">PRODUCT MANAGEMENT</div><h1>{{ 'प्रोडक्ट एडिट करें' if product else 'नया प्रोडक्ट जोड़ें' }}</h1></section><form method="post" class="form-card product-edit-form"><label>प्रोडक्ट नाम<input required name="name" value="{{ product.name if product else '' }}"></label><label>कैटेगरी<input required name="category" value="{{ product.category if product else 'School Supplies' }}" placeholder="Pens, Notebooks..."></label><label>कीमत (₹)<input required type="number" min="0" step="0.01" name="price" value="{{ product.price if product else '' }}"></label><label>स्टॉक<input required type="number" min="0" name="stock" value="{{ product.stock if product else 0 }}"></label><label class="wide">इमेज URL<input name="image_url" value="{{ product.image_url if product else '' }}" placeholder="https://..."></label><label class="wide">विवरण<textarea name="description" rows="4">{{ product.description if product else '' }}</textarea></label><label class="checkbox-label wide"><input type="checkbox" name="active" {{ 'checked' if not product or product.active else '' }}> स्टोर पर दिखाएँ</label><div class="wide form-buttons"><button class="btn">सेव करें</button><a class="btn btn-light" href="{{ url_for('admin_dashboard') }}">वापस</a></div></form>{% endblock %}
